name: Bug report
description: Something does not work the way it should
title: "[Bug] "
labels: ["bug", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Do not include secrets or participants' personal data.**
        For security problems, use the private advisory link on the issue chooser instead.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Dua is affected?
      options:
        - Registration / mentor sign-up
        - Submissions / edit links
        - Judging / scoring / recusal
        - Results / ranking
        - Admin panel
        - Email / campaigns
        - Authentication / permissions
        - Deployment / infrastructure
        - Other
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Blocker — the event cannot run
        - Critical — judging or data integrity is affected
        - Major — a key flow is broken
        - Minor — workaround exists
        - Cosmetic
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Where did you see this?
      placeholder: "local / staging / production, commit or version, browser"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
      render: markdown
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      render: markdown
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      render: markdown
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, console output or a link to a failing run. Remove personal data.
      render: markdown
    validations:
      required: false
